{% comment %}
Renderiza un campo de formulario con etiqueta, ayuda y errores.
Uso: {% include "partials/campo.html" with campo=form.email %}
{% endcomment %}
<div class="mb-3">
    <label class="form-label" for="{{ campo.id_for_label }}">
        {{ campo.label }}{% if campo.field.required %}<span class="text-danger ms-1">*</span>{% endif %}
    </label>
    {{ campo }}
    {% if campo.help_text %}
        <div class="form-text">{{ campo.help_text|safe }}</div>
    {% endif %}
    {% for error in campo.errors %}
        <div class="invalid-feedback d-block"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
    {% endfor %}
</div>
