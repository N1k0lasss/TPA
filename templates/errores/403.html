{% extends "base.html" %}

{% block titulo %}Acceso denegado{% endblock %}

{% block contenido %}
<div class="container py-5">
    <div class="surface-card empty-state mx-auto" style="max-width: 620px;">
        <div class="empty-icon" style="background: var(--is-danger-soft); color: var(--is-danger);">
            <i class="bi bi-shield-lock"></i>
        </div>
        <span class="eyebrow">Error 403</span>
        <h1 class="h2 fw-bold mt-1">No tenés permisos para entrar</h1>
        <p>
            Esta sección está reservada para determinados roles. Si creés que es un error,
            verificá con qué cuenta iniciaste sesión.
        </p>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a href="{% url 'catalogo:producto_list' %}" class="btn btn-brand">
                <i class="bi bi-shop me-2"></i>Ir al catálogo
            </a>
            <a href="{% url 'usuarios:perfil' %}" class="btn btn-soft">Mi perfil</a>
        </div>
    </div>
</div>
{% endblock %}
